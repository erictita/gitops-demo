name: CI-CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_ADMINTITA }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Setup Docker Buildx
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t admintita/express-app:${{ github.sha }} .

      # 5. Push Docker image
      - name: Push Docker image
        run: |
          docker push admintita/express-app:${{ github.sha }}

      # 6. Update Kubernetes deployment file
      - name: Update Kubernetes manifest
        run: |
          sed -i "s|image:.*|image: admintita/express-app:${{ github.sha }}|g" k8s/deployment.yaml

      # 7. Commit updated manifest
      - name: Commit and push changes
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

          git add k8s/deployment.yaml
          git commit -m "Update image to ${{ github.sha }}" || echo "No changes"

          git pull --rebase origin main
          git push
