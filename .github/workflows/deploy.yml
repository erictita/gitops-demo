name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_ADMINTITA }}
          password: ${{ secrets.DOCKERHUB_admintita}}

      # 3. Set up Docker Buildx
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_ADMINTITA }}/node-app:latest .

      # 5. Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_ADMINTITA }}/node-app:latest