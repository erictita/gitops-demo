apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:0245cfdf8c215e62b956e69b1f597a1a1c09c915
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000