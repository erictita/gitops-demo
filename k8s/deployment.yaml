apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:b34c2ef2fb8ed60580f5601c27d58c5b9f667352
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000