apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:ae0f4f55ffc6973e1e12010bc66ad3d646bc2868
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000