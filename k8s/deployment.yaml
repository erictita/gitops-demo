apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:31532cc629924882d47c64e197f3b341b280d17b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000