apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:a61d0c244b29231a7ff98a253e034c7514243ab0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000