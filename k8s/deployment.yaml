apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:d6315097b5356cf236e8de384fab361a98ba98fa
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000