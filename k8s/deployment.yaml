apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:98d3bb06d27b1011f3e3586bf627ae3b13531e0d
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000