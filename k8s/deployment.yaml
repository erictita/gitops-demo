apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:1cdc91b9cffb355a5f392cb9a2388bb702637481
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000