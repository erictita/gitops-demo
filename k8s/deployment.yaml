apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:27e2593e4c99ddb92f1b922a9cb0bc93bbaf157f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000