apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:ba38339d31d2db67141374a3d483de9b4d1351b1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000