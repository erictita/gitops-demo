apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:9059bbdafab410782343922cdaba0de1fd7cf6e4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000