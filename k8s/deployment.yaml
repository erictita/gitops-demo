apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express-app
          image: admintita/express-app:b8880ff202c437c6c0cd608f62341c58dba3bf31
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000